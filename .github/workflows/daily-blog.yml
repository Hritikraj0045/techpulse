name: TechPulse Daily Blog

on:
  schedule:
    # 06:00 Asia/Kolkata (GitHub cron is UTC)
    - cron: "30 0 * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: techpulse-publisher
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Groq-compatible OpenAI client
        run: python -m pip install --upgrade openai

      - name: Validate project data and Python syntax
        run: |
          python -m json.tool data/topics.json > /dev/null
          python -m json.tool data/blueprints.json > /dev/null
          python -m py_compile scripts/generate_article.py scripts/ai_publisher.py

      - name: Research and write today's article with AI
        env:
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          GROQ_MODEL: ${{ vars.GROQ_MODEL || 'openai/gpt-oss-120b' }}
        run: python scripts/ai_publisher.py

      - name: Commit and push article
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add articles data/state.json index.md
          if git diff --cached --quiet; then
            echo "Nothing new to publish."
          else
            GIT_AUTHOR_NAME="Hritik Raj Arya" \
            GIT_AUTHOR_EMAIL="78204084+Hritikraj0045@users.noreply.github.com" \
              git commit -m "blog: publish AI-researched article"
            git push
          fi
